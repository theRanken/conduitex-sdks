name: Deploy

on:
  push:
    tags:
      - 'js-v*'
      - 'py-v*'
      - 'php-v*'

jobs:
  test-js:
    name: JS tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kits/javascript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test

  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kits/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  test-php:
    name: PHP tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kits/php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/pest

  publish-js:
    name: Publish JS to npm
    needs: test-js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kits/javascript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --no-package-lock
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-python:
    name: Publish Python to PyPI
    needs: test-python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kits/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  publish-php:
    name: Trigger Packagist update
    needs: test-php
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call Packagist API
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl -s -XPOST \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${PACKAGIST_USERNAME}\",\"apiToken\":\"${PACKAGIST_TOKEN}\",\"repository\":{\"url\":\"https://github.com/${{ github.repository }}\"}}" \
            https://packagist.org/api/update-package
